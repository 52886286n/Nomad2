<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nomad2 – Offline-Wissen</title>
<style>
  :root { --bg:#f4f1ea; --fg:#1d2420; --card:#fff; --line:#d9d3c5; --akzent:#2f6b4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151a17; --fg:#e8e6df; --card:#1e2521; --line:#323c36; --akzent:#7fc7a2; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:17px/1.5 system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:2rem; margin:0 0 4px; }
  p.unter { margin:0 0 32px; opacity:.75; }
  .karten { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
  a.karte { display:block; padding:24px; background:var(--card); border:1px solid var(--line);
            border-radius:12px; color:inherit; text-decoration:none; }
  a.karte:hover, a.karte:focus { border-color:var(--akzent); }
  a.karte h2 { margin:0 0 6px; font-size:1.25rem; color:var(--akzent); }
  a.karte p { margin:0; opacity:.8; }
  footer { margin-top:40px; font-size:.85rem; opacity:.65; }
  code { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:1px 5px; }
</style>
</head>
<body>
<main>
  <h1>Nomad2</h1>
  <p class="unter">Dein Offline-Wissen auf Deutsch – funktioniert ganz ohne Internet.</p>
  <div class="karten">
    <a class="karte" href="/wiki">
      <h2>Wikis</h2>
      <p>Wikipedia, Klexikon, Wikivoyage, Wiktionary und mehr – durchsuchbar.</p>
    </a>
    <a class="karte" href="/videos">
      <h2>Videos</h2>
      <p>Deine heruntergeladenen deutschen Videos, sortiert nach Kanal.</p>
    </a>
  </div>
  <footer>Neue Inhalte: <code>./nomad wiki liste</code> und <code>./nomad videos laden</code> im Projektordner.</footer>
</main>
</body>
</html>
