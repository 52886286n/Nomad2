name: nomad2

services:
  start:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PORT_START:-8880}:80"
      - "${PORT_WIKI:-8881}:8081"
    environment:
      PORT_WIKI: "${PORT_WIKI:-8881}"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - "${DATEN:-./daten}/videos:/medien:ro"
      - ./web/default.conf.template:/etc/nginx/templates/default.conf.template:ro

  wiki:
    image: ghcr.io/kiwix/kiwix-tools:latest
    restart: unless-stopped
    volumes:
      - "${DATEN:-./daten}/zim:/data"
    # Liest die Bibliotheksdatei und lädt sie automatisch neu, wenn ./nomad sie ändert.
    command: ["kiwix-serve", "--port", "8080", "--library", "--monitorLibrary", "/data/library.xml"]
